[workspace]
resolver = "2"
members = ["crates/hideboot-core", "crates/hideboot"]

[workspace.package]
version = "0.2.0"
edition = "2024"
# Stable minus two releases, as in hideOS.
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/youhide/hideBoot"
publish = false

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
